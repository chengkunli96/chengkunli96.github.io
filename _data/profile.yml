short_bio: >-

  I am Chengkun L, I am the final-year Ph.D. candidate at <a href="https://www.cuhk.edu.hk/english/index.html">the Chinese University of Hong Kong (CUHK)</a> and work under the supervision 
  of Prof. <a href="https://www.cse.cuhk.edu.hk/~qdou/">Qi Dou</a> 
  and Prof. <a href="https://www.med.cuhk.edu.hk/staff/dr-chan-ying-kuen-jason">Jason Ying-Kuen Chan</a>. 
  My research bridges 3D Computer Vision and Surgical Robotics, focusing on reconstruction, neural rendering, and generative AI for surgical area.
  <br><br>
  Prior to my Ph.D., I obtained my M.Sc. in Computer Graphics, Vision and Imaging 
  with Distinction from <a href="https://www.ucl.ac.uk/">University College London (UCL)</a> 
  and my B.Eng. from <a href="https://is.buaa.edu.cn/en/">Beihang University (BUAA)</a>.


